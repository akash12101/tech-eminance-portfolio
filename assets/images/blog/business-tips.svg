<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Business strategy illustration">
  <defs>
    <linearGradient id="bgBt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glowBt" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#e8520a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8520a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulbBt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#c8430a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgBt)"/>
  <rect width="400" height="250" fill="url(#glowBt)"/>

  <!-- lightbulb -->
  <circle cx="150" cy="112" r="38" fill="url(#bulbBt)" opacity="0.92"/>
  <rect x="136" y="146" width="28" height="14" rx="3" fill="#f4f1ec" opacity="0.85"/>
