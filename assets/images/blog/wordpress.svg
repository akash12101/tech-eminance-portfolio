<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Content management system illustration">
  <defs>
    <linearGradient id="bgWp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glowWp" cx="0.7" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#e8520a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e8520a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgWp)"/>
  <rect width="400" height="250" fill="url(#glowWp)"/>

  <!-- stacked content blocks -->
  <rect x="120" y="70" width="160" height="34" rx="6" fill="#f4f1ec" opacity="0.9"/>
  <rect x="120" y="112" width="160" height="34" rx="6" fill="#e8520a" opacity="0.85"/>
  <rect x="120" y="154" width="160" height="34" rx="6" fill="#f4f1ec" opacity="0.22"/>

  <!-- gear -->
  <g transform="translate(290,182)">
    <circle r="22" fill="none" stroke="#f4f1ec" stroke-width="6" opacity="0.85"/>
    <circle r="7" fill="#f4f1ec" opacity="0.85"/>
    <g stroke="#f4f1ec" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-30" x2="0" y2="-22"/>
      <line x1="0" y1="30" x2="0" y2="22"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <line x1="30" y1="0" x2="22" y2="0"/>
      <line x1="-21" y1="-21" x2="-15" y2="-15"/>
      <line x1="21" y1="21" x2="15" y2="15"/>
      <line x1="-21" y1="21" x2="-15" y2="15"/>
      <line x1="21" y1="-21" x2="15" y2="-15"/>
    </g>
  </g>
</svg>
