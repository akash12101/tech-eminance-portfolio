<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ecommerce illustration">
  <defs>
    <linearGradient id="bgEc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glowEc" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#e8520a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8520a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cartEc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#c8430a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgEc)"/>
  <rect width="400" height="250" fill="url(#glowEc)"/>

  <!-- cart -->
  <path d="M140 96 h150 l-18 68 h-104 z" fill="url(#cartEc)" opacity="0.9"/>
  <path d="M112 88 h24 l10 20" stroke="#f4f1ec" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="182" cy="192" r="12" fill="#f4f1ec" opacity="0.9"/>
  <circle cx="248" cy="192" r="12" fill="#f4f1ec" opacity="0.9"/>

  <!-- coins -->
  <circle cx="300" cy="90" r="20" fill="#f4f1ec" opacity="0.16"/>
  <circle cx="322" cy="112" r="20" fill="#f4f1ec" opacity="0.24"/>
  <text x="300" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f4f1ec" opacity="0.55">$</text>
  <text x="322" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f4f1ec" opacity="0.7">$</text>
</svg>
