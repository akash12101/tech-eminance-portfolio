<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Search engine optimization illustration">
  <defs>
    <linearGradient id="bgSeo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="barSeo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8430a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <radialGradient id="glowSeo" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#e8520a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8520a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgSeo)"/>
  <rect width="400" height="250" fill="url(#glowSeo)"/>

  <!-- bar chart -->
  <g>
    <rect x="150" y="150" width="22" height="45" rx="3" fill="url(#barSeo)" opacity="0.55"/>
    <rect x="180" y="120" width="22" height="75" rx="3" fill="url(#barSeo)" opacity="0.75"/>
    <rect x="210" y="90"  width="22" height="105" rx="3" fill="url(#barSeo)"/>
  </g>
  <!-- rising arrow -->
  <path d="M148 128 L182 96 L214 112 L246 66" stroke="#f4f1ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M228 66 L246 66 L246 84" stroke="#f4f1ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- magnifying glass -->
  <circle cx="118" cy="120" r="34" fill="none" stroke="#f4f1ec" stroke-width="6" opacity="0.92"/>
  <line x1="141" y1="144" x2="164" y2="167" stroke="#f4f1ec" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
  <circle cx="118" cy="120" r="34" fill="#e8520a" opacity="0.12"/>
</svg>
