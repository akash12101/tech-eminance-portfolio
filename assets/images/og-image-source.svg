  <circle cx="146" cy="76" r="9" fill="#ff9a3c"/>
  <path d="M92 92 h40 l-6 12 h-14 l-14 34 h-14 l14 -34 h-14 z" fill="url(#ogRing)"/>

  <text x="172" y="122" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#f4f1ec">TECH EMINENCE</text>

  <text x="90" y="270" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#f4f1ec">We Build Websites</text>
  <text x="90" y="335" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900" fill="#e8520a">That Actually Grow.</text>
  <text x="90" y="392" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f4f1ec" opacity="0.65">Premium Web Design · Development · SEO · Shopify · WordPress</text>

