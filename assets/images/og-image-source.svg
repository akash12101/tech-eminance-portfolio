    <rect x="0" y="0" width="360" height="36" rx="14" fill="#2c2c2c"/>
    <circle cx="24" cy="18" r="6" fill="#e8520a"/>
    <circle cx="44" cy="18" r="6" fill="#f4f1ec" opacity="0.3"/>
    <circle cx="64" cy="18" r="6" fill="#f4f1ec" opacity="0.3"/>

    <rect x="24" y="58" width="312" height="34" rx="6" fill="#e8520a" opacity="0.85"/>
    <rect x="24" y="104" width="150" height="94" rx="8" fill="#f4f1ec" opacity="0.10"/>
    <rect x="186" y="104" width="150" height="40" rx="6" fill="#f4f1ec" opacity="0.22"/>
    <rect x="186" y="152" width="110" height="12" rx="4" fill="#f4f1ec" opacity="0.18"/>
    <rect x="186" y="174" width="150" height="12" rx="4" fill="#f4f1ec" opacity="0.18"/>

    <rect x="44" y="150" width="18" height="34" rx="3" fill="url(#ogBar)" opacity="0.6"/>
