<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#e8520a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8520a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e8520a"/>
    </linearGradient>
    <linearGradient id="ogBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8430a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
